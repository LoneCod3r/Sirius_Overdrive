<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sirius Overdrive: Edge of Oblivion</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet" />
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <input
    id="nameInput"
    type="text"
    maxlength="10"
    autocomplete="off"
    autocapitalize="characters"
    spellcheck="false"
    aria-label="Pilot name"
  />
  <div id="rotateOverlay" hidden>
    <div id="rotateIcon">&#8635;</div>
    <div id="rotateText">ROTATE YOUR DEVICE<br />TO LANDSCAPE TO PLAY</div>
  </div>
  <script src="player-ship-assets.js"></script>
  <script src="game.js"></script>
</body>
</html>
