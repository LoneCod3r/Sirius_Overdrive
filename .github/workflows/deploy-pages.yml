name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Remove non-game files from the deploy artifact
        run: |
          rm -rf .git .github
          rm -f Digital_SFX_Set.zip Plan.docx README.md fav1.png \
                Main1-problem.png main1-flame-tails.png problem-ship.png \
                problem-title-scale.png problem-visualization.png \
                firebase.json .firebaserc

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
